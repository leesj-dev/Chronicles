[package]
name = "chronicles"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
publish = false
description = "Local dashboard and history collector for AI usage"

[dependencies]
# Pinned upstream commit; see README.md for upgrade instructions.
tokscale-core = { git = "https://github.com/junhoyeo/tokscale", rev = "b265e83" }
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 16
strip = true
