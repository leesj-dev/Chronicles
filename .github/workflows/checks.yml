name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - run: npm run check
      - run: npm test
      - run: npm run test:collectors
      - run: cd engine && cargo run --locked -- export /tmp/Chronicles-demo.html --demo
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: swift build --package-path macos
      - run: macos/.build/debug/chronicles-core-checks
      - run: node macos/scripts/analytics-parity.mjs
      - run: macos/scripts/build-app.sh
      - run: swift macos/scripts/font-check.swift
